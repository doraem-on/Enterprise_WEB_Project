spring.application.name=ReConnect
server.port=${PORT:8080}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/reconnect}
spring.datasource.username=${DATABASE_USER:lalit}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.thymeleaf.cache=false
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
reconnect.demo=${DEMO_MODE:true}
reconnect.demo-password=${DEMO_PASSWORD:ReConnect!2026}
reconnect.models=${MODEL_DIR:models}
spring.jackson.serialization.write-dates-as-timestamps=false

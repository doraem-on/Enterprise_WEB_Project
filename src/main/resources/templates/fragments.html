<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body>
<head th:fragment="head"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title th:text="${title != null ? title + ' · ReConnect' : 'ReConnect · A new chapter'}">ReConnect</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"><script defer src="/app.js"></script></head>
<div th:fragment="brand" class="brand"><span class="brand-mark">r<span>c</span></span><span>ReConnect<small>A NEW CHAPTER</small></span></div>
<div th:fragment="programCard(p)" class="program-card"><div class="program-art" th:classappend="${p.category}" aria-hidden="true"><div class="art-shape"></div><span th:text="${p.category == 'Vocational' ? '✳' : p.category == 'Creative' ? '◒' : p.category == 'Education' ? '▤' : '◉'}"></span><small th:text="${p.category}"></small></div><div class="card-body"><span class="eyebrow" th:text="${p.category}"></span><h3><a th:href="@{/programs/{id}(id=${p.id})}" th:text="${p.title}"></a></h3><p th:text="${p.description}"></p><div class="card-meta"><span th:text="${p.duration + ' sessions'}"></span><span th:text="${p.capacity - p.occupied + ' seats available'}"></span></div><a class="text-link" th:href="@{/programs/{id}(id=${p.id})}">Explore program</a></div></div>
<div th:fragment="enrollmentTable" class="table-wrap"><table><thead><tr><th>Participant / program</th><th>Status</th><th>Attendance</th><th>Assessment</th><th>Actions</th></tr></thead><tbody><tr th:each="e:${enrollments}"><td><strong th:text="${e.participant}"></strong><a th:href="@{/programs/{id}(id=${e.program_id})}" th:text="${e.title}" class="subtext"></a></td><td><span class="badge" th:classappend="${e.status}" th:text="${#strings.toLowerCase(e.status)}"></span></td><td th:text="${e.attended + ' / ' + e.duration}"></td><td th:text="${e.score != null ? e.score + '%' : 'Not taken'}"></td><td><div class="actions"><form th:if="${isStaff and (e.status=='REQUESTED' or e.status=='WAITLISTED')}" th:action="@{/enrollments/{id}/approve(id=${e.id})}" method="post"><button class="small">Approve</button></form><form th:if="${isStaff and e.status=='REQUESTED'}" th:action="@{/enrollments/{id}/waitlist(id=${e.id})}" method="post"><button class="small secondary">Waitlist</button></form><form th:if="${(isStaff or isParticipant) and e.status!='COMPLETED' and e.status!='CANCELLED'}" th:action="@{/enrollments/{id}/cancel(id=${e.id})}" method="post" data-confirm="Cancel this enrollment and release its seat?"><button class="small ghost">Cancel</button></form><form th:if="${!isParticipant and e.status=='ENROLLED'}" th:action="@{/enrollments/{id}/complete(id=${e.id})}" method="post"><button class="small secondary">Complete</button></form><a th:if="${e.certificate_id != null}" class="text-link" th:href="@{/certificates/{id}(id=${e.certificate_id})}">Certificate</a></div></td></tr><tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="5" class="empty">No enrollments yet. Explore the program catalog to get started.</td></tr></tbody></table></div>
</body></html>

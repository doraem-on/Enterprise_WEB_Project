<!doctype html><html lang="en" th:lang="${ui.language}" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="kiosk-page"><a class="skip-link" href="#main" th:text="${ui.t('Skip to content')}">Skip to content</a><header class="kiosk-header"><a href="/kiosk"><div th:replace="~{fragments :: brand}"></div></a><form th:action="@{/logout}" method="post" id="kiosk-logout"><button th:text="${ui.t('Sign out')}">Sign out</button></form></header><main id="main" class="kiosk-main"><div th:replace="~{accessibility :: controls}"></div><span class="eyebrow" th:text="${ui.t('CORRECTIONAL REHABILITATION')}"></span><h1 th:text="${ui.t('Your daily activity board')}"></h1><p th:text="${actor.name}"></p><p class="muted"><span th:text="${ui.t('This kiosk signs out after five minutes without interaction. Do not leave your session unattended.')}">This kiosk signs out after five minutes without interaction. Do not leave your session unattended.</span></p><div class="kiosk-grid"><a class="kiosk-tile" href="/learning"><span>▤</span><strong th:text="${ui.t('My learning')}"></strong></a><a class="kiosk-tile" href="/plans"><span>◎</span><strong th:text="${ui.t('My plan')}"></strong></a><a class="kiosk-tile" href="/schedule"><span>▦</span><strong th:text="${ui.t('My schedule')}"></strong></a><a class="kiosk-tile" href="/programs"><span>✳</span><strong th:text="${ui.t('Available programs')}"></strong></a><a class="kiosk-tile" href="/projects"><span>♧</span><strong th:text="${ui.t('Community projects')}"></strong></a><a class="kiosk-tile" href="/feedback"><span>◉</span><strong th:text="${ui.t('Ask for support')}"></strong></a></div><section class="panel"><h2 th:text="${ui.t('Your next sessions')}"></h2><div class="session-row" th:each="s:${sessions}"><strong th:text="${s.title}"></strong><span th:text="${#dates.format(s.starts_at,'dd MMM · HH:mm')+' · '+s.room}"></span></div><p th:if="${#lists.isEmpty(sessions)}"><span th:text="${ui.t('No upcoming sessions are scheduled.')}">No upcoming sessions are scheduled.</span></p></section><a class="text-link" href="/dashboard" th:text="${ui.t('Standard workspace')}"></a></main></body></html>

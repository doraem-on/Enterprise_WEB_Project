<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body><main class="document-page"><header><a href="/participants"><div th:replace="~{fragments :: brand}"></div></a><button type="button" data-print>Print / save PDF</button></header><span class="eyebrow">PERSONAL SKILLS PORTFOLIO</span><h1 th:text="${person.name}"></h1><p th:text="${person.education}"></p><div class="two-grid"><section class="panel"><h2>Existing skills</h2><p th:text="${person.skills}"></p><small>Self-reported profile information</small></section><section class="panel"><h2>Goals & interests</h2><p th:text="${person.goals}"></p><p th:text="${person.interests}"></p></section></div><h2>Learning record</h2><table><thead><tr><th>Program</th><th>Status</th><th>Attendance</th><th>Knowledge check</th></tr></thead><tbody><tr th:each="e:${enrollments}" th:if="${e.status=='ENROLLED' or e.status=='COMPLETED'}"><td th:text="${e.title}"></td><td th:text="${e.status}"></td><td th:text="${e.attended+'/'+e.duration}"></td><td th:text="${e.score==null?'Not yet taken':e.score+'%'}"></td></tr></tbody></table><p class="document-footer">Shared at the participant's discretion. Program completion records are not externally accredited qualifications.</p></main></body></html>

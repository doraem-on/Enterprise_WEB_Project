<html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="controls" class="access-tools"><form method="get" th:action="${currentPath}" class="language-form"><label><span class="sr-only" th:text="${ui.t('Language')}">Language</span><select name="lang" aria-label="Language"><option value="en" th:selected="${ui.language=='en'}">English</option><option value="hi" th:selected="${ui.language=='hi'}">हिन्दी</option><option value="pa" th:selected="${ui.language=='pa'}">ਪੰਜਾਬੀ</option></select></label><button class="small secondary" th:text="${ui.t('Apply language')}">Apply language</button></form><button class="small secondary" type="button" data-text-size aria-pressed="false" th:text="${ui.t('Larger text')}">Larger text</button><button class="small secondary" type="button" data-contrast aria-pressed="false" th:text="${ui.t('High contrast')}">High contrast</button></div></body></html>
